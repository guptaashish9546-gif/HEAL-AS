{% extends "base.html" %}{% block title %}Register — HEAL-AS{% endblock %}
{% block content %}<div class="formwrap"><div class="formcard"><span class="eyebrow">CREATE YOUR ACCOUNT</span><h1>Registration</h1><p class="subtle">Your account stores your analysis history and protects report access.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post"><label>Full Name<input name="name" value="{{ form.get('name','') if form else '' }}" autocomplete="name" required></label><label>Email<input type="email" name="email" value="{{ form.get('email','') if form else '' }}" autocomplete="email" required></label><div class="grid2"><label>Age<input type="number" name="age" min="0" max="120" value="{{ form.get('age','') if form else '' }}" required></label><label>Gender<select name="gender" required><option value="">Select</option><option {% if form and form.get('gender')=='Female' %}selected{% endif %}>Female</option><option {% if form and form.get('gender')=='Male' %}selected{% endif %}>Male</option><option {% if form and form.get('gender')=='Other' %}selected{% endif %}>Other</option></select></label></div><label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required><small>Use at least 8 characters.</small></label><label>Confirm Password<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label><button class="btn full" type="submit">Create Account →</button></form><p>Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></div>{% endblock %}
