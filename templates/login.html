{% extends "base.html" %}{% block title %}Login — HEAL-AS{% endblock %}
{% block content %}<div class="formwrap"><div class="formcard"><span class="eyebrow">SECURE ACCESS</span><h1>Welcome back</h1><p class="subtle">Sign in to access analysis modules and your report history.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post"><label>Email<input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="btn full" type="submit">Login →</button></form><p>Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p><p><a href="{{ url_for('index') }}">← Back to Home</a></p></div></div>{% endblock %}
